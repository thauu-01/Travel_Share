services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelshare-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    expose:
      - "5000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "node", "--no-warnings", "-e", "fetch('http://localhost:5000/api/health').then(r => r.status === 200 ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - travelshare-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelshare-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - travelshare-net

networks:
  travelshare-net:
    driver: bridge
